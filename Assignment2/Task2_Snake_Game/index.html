<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #c8d6e5;
      user-select: none;
      -webkit-user-select: none;
    }

    .game {
      background: #16213e;
      border-radius: 20px;
      padding: 28px 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: min(94vw, 520px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #536878; }
    .stat-value { font-size: 26px; font-weight: 600; color: #e8eef2; line-height: 1.2; }
    .stat-value.best { color: #f1c40f; }

    .canvas-wrapper {
      position: relative;
      background: #0f1629;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: rgba(15,22,41,0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .overlay h2 { font-size: 28px; font-weight: 600; color: #e8eef2; margin-bottom: 6px; }
    .overlay p { font-size: 14px; color: #8899aa; margin-bottom: 20px; }
    .overlay .score-big { font-size: 48px; font-weight: 700; color: #f1c40f; margin: 4px 0; }
    .overlay .sub { font-size: 13px; color: #536878; margin-top: -2px; margin-bottom: 18px; }

    .btn {
      background: #0f3460;
      color: #c8d6e5;
      border: none; border-radius: 10px;
      padding: 12px 32px;
      font-size: 15px; font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: #1a4a7a; transform: scale(1.02); }
    .btn:active { transform: scale(0.97); }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 4px;
      font-size: 13px;
      color: #536878;
    }
    .footer kbd {
      display: inline-block;
      background: #0f1629;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      color: #8899aa;
      margin: 0 2px;
    }
    .footer .hint-mobile { display: none; }

    .touch-grid {
      display: none;
      gap: 4px;
      margin-top: 14px;
    }
    .touch-grid button {
      background: #0f3460;
      border: none; border-radius: 10px;
      color: #c8d6e5;
      font-size: 22px;
      padding: 14px;
      cursor: pointer;
      transition: background 0.15s;
      touch-action: manipulation;
    }
    .touch-grid button:active { background: #1a4a7a; }
    .touch-grid .row { display: flex; justify-content: center; gap: 4px; }
    .touch-grid .row:first-child { margin-bottom: 0; }

    @media (pointer: coarse) {
      .footer .hint-desktop { display: none; }
      .footer .hint-mobile { display: inline; }
      .touch-grid { display: grid; grid-template-rows: auto auto; }
      .game { padding: 18px 16px 16px; width: min(98vw, 480px); }
      .stat-value { font-size: 22px; }
    }

    @media (max-width: 380px) {
      .game { padding: 14px 12px 12px; }
      .stat-value { font-size: 20px; }
      .overlay h2 { font-size: 22px; }
      .overlay .score-big { font-size: 38px; }
    }
  </style>
</head>
<body>

<div class="game">
  <div class="header">
    <div class="stat">
      <span class="stat-label">Score</span>
      <span class="stat-value" id="score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Best</span>
      <span class="stat-value best" id="best">0</span>
    </div>
    <div class="stat" style="text-align:right">
      <span class="stat-label">Speed</span>
      <span class="stat-value" id="speed">1</span>
    </div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="canvas" width="600" height="600"></canvas>

    <div class="overlay" id="pauseOverlay">
      <h2>Paused</h2>
      <p>Press <kbd style="background:#0f3460;padding:2px 10px;border-radius:4px;font-family:inherit;color:#c8d6e5">P</kbd> to resume</p>
    </div>

    <div class="overlay" id="gameoverOverlay">
      <h2>Game Over</h2>
      <div class="score-big" id="finalScore">0</div>
      <div class="sub">points</div>
      <button class="btn" id="restartBtn">Play Again</button>
    </div>
  </div>

  <div class="touch-grid" id="touchGrid">
    <div class="row"><button data-dir="up">&#9650;</button></div>
    <div class="row">
      <button data-dir="left">&#9664;</button>
      <button data-dir="down">&#9660;</button>
      <button data-dir="right">&#9654;</button>
    </div>
  </div>

  <div class="footer">
    <span class="hint-desktop"><kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &middot; <kbd>P</kbd> pause</span>
    <span class="hint-mobile">Swipe or tap arrows &middot; <kbd>P</kbd> pause</span>
    <span style="color:#536878">v2</span>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const finalScoreEl = document.getElementById('finalScore');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const gameoverOverlay = document.getElementById('gameoverOverlay');
  const restartBtn = document.getElementById('restartBtn');

  const W = 600, H = 600;
  const GRID = 20;
  const COLS = W / GRID;
  const ROWS = H / GRID;

  // ── State ──
  let snake, food, dir, nextDir, score, speed, best;
  let gameover, paused, running, frameId;
  let lastUpdate = 0;
  const BASE_INTERVAL = 150;
  let moveInterval = BASE_INTERVAL;

  // ── localStorage best ──
  function loadBest() {
    try { return parseInt(localStorage.getItem('snakeBest')) || 0; } catch(e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('snakeBest', v); } catch(e) {}
  }

  // ── Sounds (Web Audio) ──
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  }
  function playTone(freq, dur, type) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  function soundEat() { playTone(520, 0.1, 'sine'); }
  function soundDie() { playTone(200, 0.35, 'sawtooth'); }

  // ── Init ──
  function init() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
      {x: midX, y: midY},
      {x: midX - 1, y: midY},
      {x: midX - 2, y: midY}
    ];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 1;
    moveInterval = BASE_INTERVAL;
    best = loadBest();
    gameover = false;
    paused = false;
    running = true;
    scoreEl.textContent = '0';
    bestEl.textContent = best;
    speedEl.textContent = '1';
    pauseOverlay.classList.remove('active');
    gameoverOverlay.classList.remove('active');
    spawnFood();
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let free = [];
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (!occupied.has(`${x},${y}`)) free.push({x, y});
      }
    }
    if (free.length === 0) return;
    food = free[Math.floor(Math.random() * free.length)];
  }

  // ── Update ──
  function update() {
    if (gameover || paused) return;

    dir = {...nextDir};
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // Wall wrap
    if (head.x < 0) head.x = COLS - 1;
    if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    if (head.y >= ROWS) head.y = 0;

    // Self collision
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        die(); return;
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      speed = Math.min(1 + Math.floor(score / 5), 20);
      moveInterval = Math.max(60, BASE_INTERVAL - (speed - 1) * 10);
      scoreEl.textContent = score;
      speedEl.textContent = speed;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        saveBest(best);
      }
      soundEat();
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function die() {
    gameover = true;
    running = false;
    finalScoreEl.textContent = score;
    gameoverOverlay.classList.add('active');
    soundDie();
  }

  // ── Render ──
  function render() {
    ctx.clearRect(0, 0, W, H);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * GRID, 0); ctx.lineTo(x * GRID, H); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * GRID); ctx.lineTo(W, y * GRID); ctx.stroke();
    }

    // Food
    const fx = food.x * GRID + GRID/2;
    const fy = food.y * GRID + GRID/2;
    const fr = GRID * 0.4;
    ctx.save();
    ctx.shadowColor = '#e94560';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#e94560';
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(fx - 3, fy - 3, 4, 0, 2 * Math.PI); ctx.fill();

    // Snake
    const len = snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const s = snake[i];
      const px = s.x * GRID, py = s.y * GRID;
      const pad = i === 0 ? 1 : 2;
      const radius = 4;

      const r = px + pad, w = GRID - pad * 2, h = GRID - pad * 2;
      const t = py + pad;

      if (i === 0) {
        // Head
        ctx.save();
        ctx.shadowColor = 'rgba(67, 173, 255, 0.3)';
        ctx.shadowBlur = 6;
        ctx.fillStyle = '#43adff';
        ctx.beginPath();
        ctx.moveTo(r + radius, t);
        ctx.lineTo(r + w - radius, t);
        ctx.quadraticCurveTo(r + w, t, r + w, t + radius);
        ctx.lineTo(r + w, t + h - radius);
        ctx.quadraticCurveTo(r + w, t + h, r + w - radius, t + h);
        ctx.lineTo(r + radius, t + h);
        ctx.quadraticCurveTo(r, t + h, r, t + h - radius);
        ctx.lineTo(r, t + radius);
        ctx.quadraticCurveTo(r, t, r + radius, t);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        // Eyes
        ctx.fillStyle = '#fff';
        const ex = dir.x === -1 ? -3 : dir.x === 1 ? 3 : 0;
        const ey = dir.y === -1 ? -3 : dir.y === 1 ? 3 : 0;
        ctx.beginPath(); ctx.arc(px + 7 + ex, py + 7 + ey, 3, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(px + 13 + ex, py + 7 + ey, 3, 0, 2*Math.PI); ctx.fill();
        ctx.fillStyle = '#0a1628';
        ctx.beginPath(); ctx.arc(px + 7 + ex*1.5, py + 7 + ey*1.5, 1.5, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(px + 13 + ex*1.5, py + 7 + ey*1.5, 1.5, 0, 2*Math.PI); ctx.fill();
      } else {
        // Body — gradient from head color to tail
        const t2 = i / len;
        const gr = Math.round(67 - t2 * 40);
        const gg = Math.round(173 - t2 * 80);
        const gb = Math.round(255 - t2 * 100);
        ctx.fillStyle = `rgb(${gr},${gg},${gb})`;
        ctx.beginPath();
        ctx.moveTo(r + radius, t);
        ctx.lineTo(r + w - radius, t);
        ctx.quadraticCurveTo(r + w, t, r + w, t + radius);
        ctx.lineTo(r + w, t + h - radius);
        ctx.quadraticCurveTo(r + w, t + h, r + w - radius, t + h);
        ctx.lineTo(r + radius, t + h);
        ctx.quadraticCurveTo(r, t + h, r, t + h - radius);
        ctx.lineTo(r, t + radius);
        ctx.quadraticCurveTo(r, t, r + radius, t);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  // ── Game Loop ──
  function loop(timestamp) {
    if (!running) {
      frameId = requestAnimationFrame(loop);
      return;
    }
    if (!lastUpdate) lastUpdate = timestamp;
    const elapsed = timestamp - lastUpdate;
    if (elapsed >= moveInterval) {
      update();
      lastUpdate = timestamp - (elapsed % moveInterval);
    }
    render();
    frameId = requestAnimationFrame(loop);
  }

  function start() {
    if (frameId) cancelAnimationFrame(frameId);
    init();
    lastUpdate = 0;
    running = true;
    gameover = false;
    frameId = requestAnimationFrame(loop);
  }

  // ── Input ──
  function setDir(dx, dy) {
    if (dx === -dir.x && dy === -dir.y) return; // no reverse
    if (gameover) return;
    nextDir = {x: dx, y: dy};
  }

  document.addEventListener('keydown', e => {
    const key = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D','p','P',' '].includes(key)) {
      e.preventDefault();
    }

    switch (key) {
      case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
      case 'p': case 'P':
        if (gameover) break;
        paused = !paused;
        pauseOverlay.classList.toggle('active', paused);
        break;
      case ' ':
        if (gameover) { start(); }
        break;
    }
  });

  // ── Touch / Swipe ──
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', e => {
    initAudio();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, {passive: true});

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
  }, {passive: false});

  canvas.addEventListener('touchend', e => {
    if (!touchStartX || !touchStartY) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    if (Math.max(absDx, absDy) < 20) return;
    if (absDx > absDy) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStartX = touchStartY = 0;
  }, {passive: true});

  // ── Touch buttons ──
  document.getElementById('touchGrid').addEventListener('click', e => {
    initAudio();
    const btn = e.target.closest('button');
    if (!btn) return;
    switch (btn.dataset.dir) {
      case 'up': setDir(0, -1); break;
      case 'down': setDir(0, 1); break;
      case 'left': setDir(-1, 0); break;
      case 'right': setDir(1, 0); break;
    }
  });

  // ── Restart btn ──
  restartBtn.addEventListener('click', start);

  // ── Init audio on any interaction ──
  document.addEventListener('click', initAudio, {once: true});
  document.addEventListener('touchstart', initAudio, {once: true});

  // ── Go ──
  start();
})();
</script>
</body>
</html>
