<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 800px;
        }
        
        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            letter-spacing: 2px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        
        .score-container {
            background-color: #111;
            padding: 10px 20px;
            border-radius: 5px;
            border: 2px solid #00ff00;
        }
        
        .controls {
            background-color: #111;
            padding: 10px 20px;
            border-radius: 5px;
            border: 2px solid #00ff00;
            font-size: 0.9rem;
        }
        
        canvas {
            border: 4px solid #00ff00;
            background-color: #111;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 20, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 3px solid #00ff00;
            text-align: center;
            z-index: 10;
            width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }
        
        .game-over h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ff0000;
        }
        
        .game-over p {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        
        .game-over .restart {
            font-size: 1rem;
            margin-top: 20px;
            color: #aaa;
        }
        
        .hidden {
            display: none;
        }
        
        footer {
            margin-top: 20px;
            color: #555;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CLASSIC SNAKE GAME</h1>
        
        <div class="game-info">
            <div class="score-container">
                Score: <span id="score">0</span>
            </div>
            <div class="controls">
                Controls: Arrow Keys | Restart: Space
            </div>
        </div>
        
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div id="gameOverScreen" class="game-over hidden">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Press <span style="color:#00ff00">SPACE</span> to restart</p>
            <p class="restart">Or click anywhere to restart</p>
        </div>
        
        <footer>
            Retro Arcade Snake Game | Arrow keys to move | Eat food to grow
        </footer>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        
        // Game constants
        const GRID_SIZE = 20;
        const GRID_WIDTH = canvas.width / GRID_SIZE;
        const GRID_HEIGHT = canvas.height / GRID_SIZE;
        
        // Game state
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let gameRunning = true;
        
        // Initialize game
        function initGame() {
            // Initialize snake starting at center
            snake = [
                {x: Math.floor(GRID_WIDTH / 2), y: Math.floor(GRID_HEIGHT / 2)}
            ];
            
            // Initial direction
            direction = 'right';
            nextDirection = 'right';
            
            // Generate first food
            generateFood();
            
            // Reset score
            score = 0;
            scoreElement.textContent = score;
            
            // Start game
            gameRunning = true;
            gameOverScreen.classList.add('hidden');
            
            // Draw initial state
            draw();
        }
        
        // Generate food at random position
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * GRID_WIDTH),
                y: Math.floor(Math.random() * GRID_HEIGHT)
            };
            
            // Make sure food doesn't spawn on snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }
        
        // Draw everything on canvas
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                // Snake head (first segment)
                if (i === 0) {
                    ctx.fillStyle = '#00ff00';
                } else {
                    // Snake body
                    ctx.fillStyle = '#00cc00';
                }
                
                ctx.fillRect(
                    snake[i].x * GRID_SIZE,
                    snake[i].y * GRID_SIZE,
                    GRID_SIZE - 1,
                    GRID_SIZE - 1
                );
                
                // Draw eyes on head
                if (i === 0) {
                    ctx.fillStyle = '#000';
                    // Eye positions based on direction
                    let eyeOffsetX = 0, eyeOffsetY = 0;
                    
                    if (direction === 'right') {
                        eyeOffsetX = GRID_SIZE - 5;
                        eyeOffsetY = 5;
                    } else if (direction === 'left') {
                        eyeOffsetX = 3;
                        eyeOffsetY = 5;
                    } else if (direction === 'up') {
                        eyeOffsetX = 5;
                        eyeOffsetY = 3;
                    } else if (direction === 'down') {
                        eyeOffsetX = 5;
                        eyeOffsetY = GRID_SIZE - 5;
                    }
                    
                    // Draw two eyes
                    ctx.fillRect(
                        snake[i].x * GRID_SIZE + eyeOffsetX,
                        snake[i].y * GRID_SIZE + eyeOffsetY,
                        3, 3
                    );
                    
                    ctx.fillRect(
                        snake[i].x * GRID_SIZE + eyeOffsetX,
                        snake[i].y * GRID_SIZE + GRID_SIZE - eyeOffsetY,
                        3, 3
                    );
                }
            }
            
            // Draw food
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 1,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Draw grid lines
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Update direction
            direction = nextDirection;
            
            // Calculate new head position
            let head = {...snake[0]};
            
            switch(direction) {
                case 'up':
                    head.y--;
                    break;
                case 'down':
                    head.y++;
                    break;
                case 'left':
                    head.x--;
                    break;
                case 'right':
                    head.x++;
                    break;
            }
            
            // Check for collisions with walls
            if (
                head.x < 0 || 
                head.x >= GRID_WIDTH || 
                head.y < 0 || 
                head.y >= GRID_HEIGHT
            ) {
                gameOver();
                return;
            }
            
            // Check for collisions with self
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            // Check for food collision
            if (head.x === food.x && head.y === food.y) {
                // Increase score
                score++;
                scoreElement.textContent = score;
                
                // Generate new food
                generateFood();
                
                // Add new segment to snake (head becomes new segment)
                snake.unshift(head);
            } else {
                // Move snake
                snake.unshift(head);
                snake.pop();
            }
            
            // Draw updated state
            draw();
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverScreen.classList.remove('hidden');
        }
        
        // Handle keyboard input
        function handleKeyDown(e) {
            // Restart game on space if game is over
            if (!gameRunning && e.key === ' ') {
                initGame();
                return;
            }
            
            // Direction controls
            switch(e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') nextDirection = 'up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') nextDirection = 'left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') nextDirection = 'right';
                    break;
            }
        }
        
        // Click to restart when game over
        function handleClick() {
            if (!gameRunning) {
                initGame();
            }
        }
        
        // Initialize game on load
        window.addEventListener('load', initGame);
        
        // Set up event listeners
        window.addEventListener('keydown', handleKeyDown);
        canvas.addEventListener('click', handleClick);
        gameOverScreen.addEventListener('click', handleClick);
        
        // Game loop
        function gameLoop() {
            update();
            setTimeout(gameLoop, 100); // Update every 100ms
        }
        
        // Start game loop
        gameLoop();
    </script>
</body>
</html>
